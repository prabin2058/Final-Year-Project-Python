<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection</title>
    <style>
        .debug-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 1000;
            max-width: 300px;
        }
        .debug-content {
            font-size: 12px;
            line-height: 1.4;
        }
        .debug-content h4 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        .debug-content p {
            margin: 5px 0;
        }
    </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='js/styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    @keyframes nameBoxFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes borderGlow {
      0% {
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }
      50% {
        box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
      }
      100% {
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }
    }

    .name-box {
      animation: nameBoxFadeIn 0.3s ease-out, borderGlow 2s infinite;
    }

    body {
      background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(82, 82, 203, 1) 35%, rgba(0, 212, 255, 1) 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .header-nav {
      background-color: #0b4c61;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .header-nav h1 {
      color: white;
      margin: 0;
      font-size: 28px;
    }
    
    .nav-links a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    
    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 20px;
      margin: 0 auto;
      max-width: 800px;
    }
    
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    
    canvas {
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin: 0 auto;
      display: block;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
      padding: 15px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    
    .btn {
      padding: 10px 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background-color: #4CAF50;
      border-color: #4CAF50;
    }
    
    .btn-primary:hover {
      background-color: #45a049;
      border-color: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(76, 175, 80, 0.5);
    }
    
    .btn-success {
      background-color: #2196F3;
      border-color: #2196F3;
    }
    
    .btn-success:hover {
      background-color: #0b7dda;
      border-color: #0b7dda;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(33, 150, 243, 0.5);
    }
    
    .btn-secondary {
      background-color: #ff9800;
      border-color: #ff9800;
    }
    
    .btn-secondary:hover {
      background-color: #e68a00;
      border-color: #e68a00;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(255, 152, 0, 0.5);
    }
    
    .slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 300px;
    }
    
    /* Animation for recognized faces */
    @keyframes highlight {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    
    .highlight {
      animation: highlight 1s ease-in-out;
    }
    
    /* Name label styling */
    .name-label {
      background-color: rgba(76, 175, 80, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      position: absolute;
      transform: translateY(-100%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header-nav">
    <h1>DIGITAL HAJIR: Face Detection</h1>
    <div class="nav-links">
      {% if request.args.get('ref') == 'admin' %}
        <a href="/home"><i class="material-icons" style="vertical-align: middle; font-size: 18px;">home</i> Home</a>
      {% else %}
        <a href="/"><i class="material-icons" style="vertical-align: middle; font-size: 18px;">home</i> Home</a>
      {% endif %}
      <a href="/attendancelist"><i class="material-icons" style="vertical-align: middle; font-size: 18px;">list</i> View Attendance</a>
    </div>
  </div>

  <div class="container mb-4">
    <div class="row justify-content-center">
      <div class="col-12 text-center">
        <h2 class="text-white">Face Detection and Recognition</h2>
        <p class="text-white">Click "TOGGLE WEBCAM" to start face detection</p>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="canvas-container">
      <canvas width=640 height=480></canvas>
      <div class="controls">
        <button id="toggleWebcam" class="btn btn-primary" onclick="button_callback()">
          <i class="material-icons">videocam</i> TOGGLE WEBCAM
        </button>
        
        <button id="startAttendance" class="btn btn-success">
          <i class="material-icons">how_to_reg</i> START ATTENDANCE
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='picojs-master/manual_detect.js') }}"></script>
  <script>
    var initialized = false;
    var stream = null;
    function button_callback() {
      if(initialized) {
        // Stop the webcam
        if(stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        var ctx = document.getElementsByTagName('canvas')[0].getContext('2d');
        ctx.clearRect(0, 0, 640, 480);
        initialized = false;
        return;
      }
      var update_memory = manualDetect.instantiateMemory(5);
      var facefinder_classify_region = function(r, c, s, pixels, ldim) {return -1.0;};
      var cascadeurl = '{{ url_for("static", filename="picojs-master/examples/facefinder") }}';
      fetch(cascadeurl).then(function(response) {
        response.arrayBuffer().then(function(buffer) {
          var bytes = new Int8Array(buffer);
          facefinder_classify_region = manualDetect.unpackCascade(bytes);
          console.log('* facefinder loaded');
        })
      })
      var ctx = document.getElementsByTagName('canvas')[0].getContext('2d');
      function rgba_to_grayscale(rgba, nrows, ncols) { return manualDetect.rgbaToGrayscale(rgba, nrows, ncols); }
      var video = document.createElement('video');
      video.setAttribute('autoplay', '1');
      video.setAttribute('playsinline', '1');
      navigator.mediaDevices.getUserMedia({video: true, audio: false}).then(function(mediaStream) {
        stream = mediaStream;
        video.srcObject = stream;
        var last = Date.now();
        let lastRecognitionTime = {};
    let recognizedFaces = new Map();

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `alert alert-${type} position-fixed top-0 start-50 translate-middle-x mt-3`;
      notification.style.zIndex = '1000';
      notification.innerHTML = message;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }

    function drawLabel(ctx, text, x, y, size, confidence) {
      console.log('Drawing label:', { text, x, y, size, confidence });
      
      // Draw face rectangle with glow effect
      ctx.shadowColor = confidence < 70 ? 'rgba(76, 175, 80, 0.5)' : 'rgba(255, 193, 7, 0.5)';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = confidence < 70 ? '#4CAF50' : '#FFC107';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, size, size);
      
      // Reset shadow for text
      ctx.shadowColor = 'none';
      ctx.shadowBlur = 0;

      // Name box configuration
      const nameBox = {
        padding: 10,
        height: 40,
        background: confidence < 70 ? 'rgba(76, 175, 80, 0.95)' : 'rgba(255, 193, 7, 0.95)',
        textColor: '#FFFFFF'
      };

      // Set up text
      ctx.font = 'bold 20px Arial';
      const textWidth = ctx.measureText(text).width;
      const boxWidth = textWidth + (nameBox.padding * 2);

      // Calculate positions
      const boxX = x + (size/2) - (boxWidth/2);
      const boxY = y - nameBox.height - 10;

      // Draw name box background with rounded corners
      ctx.fillStyle = nameBox.background;
      ctx.beginPath();
      ctx.moveTo(boxX + 8, boxY);
      ctx.lineTo(boxX + boxWidth - 8, boxY);
      ctx.quadraticCurveTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + 8);
      ctx.lineTo(boxX + boxWidth, boxY + nameBox.height - 8);
      ctx.quadraticCurveTo(boxX + boxWidth, boxY + nameBox.height, boxX + boxWidth - 8, boxY + nameBox.height);
      ctx.lineTo(boxX + 8, boxY + nameBox.height);
      ctx.quadraticCurveTo(boxX, boxY + nameBox.height, boxX, boxY + nameBox.height - 8);
      ctx.lineTo(boxX, boxY + 8);
      ctx.quadraticCurveTo(boxX, boxY, boxX + 8, boxY);
      ctx.closePath();
      ctx.fill();

      // Draw name text
      ctx.fillStyle = nameBox.textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(
        text,
        x + (size/2),
        boxY + (nameBox.height/2) - 5
      );

      // Draw confidence score
      if (confidence !== undefined) {
        ctx.font = '14px Arial';
        const matchPercent = Math.round((1 - confidence/100) * 100);
        ctx.fillText(
          `${matchPercent}% match`,
          x + (size/2),
          boxY + nameBox.height - 8
        );
      }

      console.log('Label drawn successfully');
    }

    async function recognizeFace(faceImage, x, y, size) {
      try {
        console.log('Sending face for recognition:', { x, y, size });
        
        // Create a temporary canvas with padding around the face
        const tempCanvas = document.createElement('canvas');
        const padding = Math.round(size * 0.2); // 20% padding
        tempCanvas.width = size + (padding * 2);
        tempCanvas.height = size + (padding * 2);
        const tempCtx = tempCanvas.getContext('2d');
        
        // Draw the face with padding
        tempCtx.drawImage(
          faceImage, 
          -padding, -padding, 
          size + (padding * 2), 
          size + (padding * 2)
        );
        
        // Send for recognition
        const response = await fetch('/recognize', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            image: tempCanvas.toDataURL('image/jpeg', 1.0)
          })
        });
        
        const data = await response.json();
        console.log('Recognition response:', data);
        
        if (data.success && data.label !== "Unknown") {
          const name = data.label.split('_')[0];
          console.log(`Recognized: ${name} with confidence: ${data.confidence}`);
          
          recognizedFaces.set(`${x}-${y}`, {
            label: name,
            confidence: data.confidence,
            time: Date.now(),
            faceRect: { x, y, size }
          });

          // If we're taking attendance and haven't recorded it yet
          if (isRecognizing && !lastRecognitionTime[data.label]) {
            lastRecognitionTime[data.label] = Date.now();
            showNotification(`✓ Attendance marked for ${name}`, 'success');
          }
        } else {
          console.log(`Face not recognized: ${data.message || 'Unknown reason'}`);
          recognizedFaces.set(`${x}-${y}`, {
            label: "Unknown",
            confidence: data.confidence || 100,
            time: Date.now(),
            faceRect: { x, y, size }
          });
        }
      } catch (error) {
        console.error('Recognition error:', error);
        showNotification('⚠ Error processing face recognition', 'danger');
      }
    }

    function loop() {
      if (!initialized) return;
      var now = Date.now();
      var dt = now - last;
      last = now;

      ctx.drawImage(video, 0, 0);
      var rgba = ctx.getImageData(0, 0, 640, 480).data;
      var image = { "pixels": rgba_to_grayscale(rgba, 480, 640), "nrows": 480, "ncols": 640, "ldim": 640 };
      var params = { "shiftfactor": 0.1, "minsize": 100, "maxsize": 1000, "scalefactor": 1.1 };
      var dets = manualDetect.runCascade(image, facefinder_classify_region, params);
      dets = update_memory(dets);
      dets = manualDetect.clusterDetections(dets, 0.2);

      // Clean up old recognized faces
      for (let [key, value] of recognizedFaces) {
        if (now - value.time > 2000) { // Remove after 2 seconds of not seeing the face
          recognizedFaces.delete(key);
        }
      }

      for(i=0; i<dets.length; ++i) {
        if(dets[i][3]>50.0) {
          var r = dets[i][0], c = dets[i][1], s = dets[i][2];
          var x = c - s/2, y = r - s/2;

          // Draw rectangle around face
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'red';
          ctx.strokeRect(x, y, s, s);

          // Create temporary canvas for the face
          var tempCanvas = document.createElement('canvas');
          tempCanvas.width = 50;
          tempCanvas.height = 50;
          var tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(ctx.canvas, x, y, s, s, 0, 0, 50, 50);

          const faceKey = `${x}-${y}`;
          const recognizedFace = recognizedFaces.get(faceKey);

          if (!recognizedFace || now - recognizedFace.time > 1000) {
            // Recognize face if we haven't seen it recently
            recognizeFace(tempCanvas, x, y, s);
          } else if (recognizedFace) {
            // Draw label for recognized face
            drawLabel(ctx, recognizedFace.label, x, y, recognizedFace.confidence);
          }
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
      }).catch(function(err){ console.error(err); });
      initialized = true;
    }

    let isRecognizing = false;
    let recognitionInterval = null;

    // Handle start attendance
    document.getElementById('startAttendance').addEventListener('click', function() {
      if (!initialized) {
        alert('Please start the webcam first!');
        return;
      }

      if (!isRecognizing) {
        // Start recognition
        this.innerHTML = '<i class="material-icons">stop</i> STOP ATTENDANCE';
        this.classList.remove('btn-success');
        this.classList.add('btn-danger');
        isRecognizing = true;
        startRecognition();
      } else {
        // Stop recognition
        this.innerHTML = '<i class="material-icons">how_to_reg</i> START ATTENDANCE';
        this.classList.remove('btn-danger');
        this.classList.add('btn-success');
        isRecognizing = false;
        if (recognitionInterval) {
          clearInterval(recognitionInterval);
        }
      }
    });

    // Add debug panel to the page
    const debugPanel = document.createElement('div');
    debugPanel.className = 'debug-panel';
    debugPanel.innerHTML = `
      <div class="debug-content">
        <h4>Debug Info</h4>
        <div id="debugInfo"></div>
      </div>
    `;
    document.body.appendChild(debugPanel);

    function updateDebugInfo(info) {
      document.getElementById('debugInfo').innerHTML = `
        <p>Recognition Status: ${info.status}</p>
        <p>Label: ${info.label || 'None'}</p>
        <p>Confidence: ${info.confidence ? info.confidence.toFixed(3) : 'None'}</p>
        <p>Last Update: ${new Date().toLocaleTimeString()}</p>
      `;
    }

    function startRecognition() {
      if (recognitionInterval) {
        clearInterval(recognitionInterval);
      }

      recognitionInterval = setInterval(() => {
        if (!isRecognizing) return;

        // Get the face region from the canvas
        const canvas = document.getElementsByTagName('canvas')[0];
        const imageData = canvas.toDataURL('image/jpeg', 1.0);  // Use max quality

        updateDebugInfo({ status: 'Sending recognition request...' });

        fetch('/recognize', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            image: imageData
          })
        })
        .then(response => response.json())
        .then(data => {
          console.log('Recognition response:', data);  // Debug log
          
          updateDebugInfo({
            status: data.success ? 'Recognition successful' : 'Recognition failed',
            label: data.label,
            confidence: data.confidence,
          });

          if (data.success) {
            // Show success notification with person's name
            const notification = document.createElement('div');
            notification.className = 'alert alert-success position-fixed top-0 start-50 translate-middle-x mt-3';
            notification.style.zIndex = '1000';
            const name = data.label.split('_')[0];  // Get just the name part
            notification.innerHTML = `✓ Attendance marked for ${name}`;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);

            // Stop recognition after successful attendance
            document.getElementById('startAttendance').click();
          } else {
            // Show appropriate notification based on the response
            const notification = document.createElement('div');
            notification.className = `alert alert-${data.label === "Unknown" ? 'warning' : 'danger'} position-fixed top-0 start-50 translate-middle-x mt-3`;
            notification.style.zIndex = '1000';
            notification.innerHTML = data.message || (data.label === "Unknown" ? 
              '⚠ Face not recognized. Please try again.' : 
              '⚠ Error marking attendance. Please try again.');
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 2000);
          }
        })
        .catch(error => {
          console.error('Recognition error:', error);
          updateDebugInfo({ status: 'Recognition failed: ' + error.message });
          
          const notification = document.createElement('div');
          notification.className = 'alert alert-danger position-fixed top-0 start-50 translate-middle-x mt-3';
          notification.style.zIndex = '1000';
          notification.innerHTML = '⚠ Error marking attendance. Please try again.';
          document.body.appendChild(notification);

          setTimeout(() => notification.remove(), 3000);
        });
      }, 1000); // Check every second
    }
  </script>
</body>
</html>
