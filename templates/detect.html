<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection</title>
    <style>
        .debug-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 1000;
            max-width: 300px;
        }
        .debug-content {
            font-size: 12px;
            line-height: 1.4;
        }
        .debug-content h4 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        .debug-content p {
            margin: 5px 0;
        }
    </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='js/styles.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    @keyframes nameBoxFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes borderGlow {
      0% {
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }
      50% {
        box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
      }
      100% {
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }
    }

    .name-box {
      animation: nameBoxFadeIn 0.3s ease-out, borderGlow 2s infinite;
    }

    body {
      background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(82, 82, 203, 1) 35%, rgba(0, 212, 255, 1) 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .header-nav {
      background-color: #0b4c61;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .header-nav h1 {
      color: white;
      margin: 0;
      font-size: 28px;
    }
    
    .nav-links a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    
    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 20px;
      margin: 0 auto;
      max-width: 800px;
    }
    
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    
    canvas {
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin: 0 auto;
      display: block;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
      padding: 15px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    
    .btn {
      padding: 10px 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background-color: #4CAF50;
      border-color: #4CAF50;
    }
    
    .btn-primary:hover {
      background-color: #45a049;
      border-color: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(76, 175, 80, 0.5);
    }
    
    .btn-success {
      background-color: #2196F3;
      border-color: #2196F3;
    }
    
    .btn-success:hover {
      background-color: #0b7dda;
      border-color: #0b7dda;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(33, 150, 243, 0.5);
    }
    
    .btn-secondary {
      background-color: #ff9800;
      border-color: #ff9800;
    }
    
    .btn-secondary:hover {
      background-color: #e68a00;
      border-color: #e68a00;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(255, 152, 0, 0.5);
    }
    
    .slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 300px;
    }
    
    /* Animation for recognized faces */
    @keyframes highlight {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    
    .highlight {
      animation: highlight 1s ease-in-out;
    }
    
    /* Name label styling */
    .name-label {
      background-color: rgba(76, 175, 80, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      position: absolute;
      transform: translateY(-100%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header-nav">
    <h1>DIGITAL HAJIR: Face Detection</h1>
    <div class="nav-links">
      {% if request.args.get('ref') == 'admin' %}
        <a href="/home"><i class="material-icons" style="vertical-align: middle; font-size: 18px;">home</i> Home</a>
      {% else %}
        <a href="/"><i class="material-icons" style="vertical-align: middle; font-size: 18px;">home</i> Home</a>
      {% endif %}
      <a href="/attendancelist"><i class="material-icons" style="vertical-align: middle; font-size: 18px;">list</i> View Attendance</a>
    </div>
  </div>

  <div class="container mb-4">
    <div class="row justify-content-center">
      <div class="col-12 text-center">
        <h2 class="text-white">Face Detection and Recognition</h2>
        <p class="text-white">Click "TOGGLE WEBCAM" to start face detection</p>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="canvas-container">
      <canvas width=640 height=480></canvas>
      <div class="controls">
        <button id="toggleWebcam" class="btn btn-primary" onclick="button_callback()">
          <i class="material-icons">videocam</i> TOGGLE WEBCAM
        </button>
        
        <button id="startAttendance" class="btn btn-success">
          <i class="material-icons">how_to_reg</i> START ATTENDANCE
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='picojs-master/manual_detect.js') }}"></script>
  <script>
    var initialized = false;
    var stream = null;
    var video = null;
    var isRecognizing = false;
    var isSendingRecognition = false;
    var lastRecognitionSendTime = 0;
    var markedAttendanceSet = new Set();
    
    // Latest tracked face recognition state
    var latestFaceState = {
      isKnown: false,
      label: 'Scanning...',
      name: 'Scanning',
      roll: '',
      confidence: 0,
      expression: 'neutral',
      lastUpdate: 0,
      hasData: false
    };

    function showNotification(message, type = 'info') {
      const existing = document.querySelectorAll('.custom-alert-toast');
      existing.forEach(e => e.remove());

      const notification = document.createElement('div');
      notification.className = `alert alert-${type} position-fixed top-0 start-50 translate-middle-x mt-3 custom-alert-toast shadow-lg`;
      notification.style.zIndex = '9999';
      notification.style.borderRadius = '12px';
      notification.style.fontWeight = 'bold';
      notification.style.fontSize = '1.1rem';
      notification.style.boxShadow = '0 10px 25px rgba(0,0,0,0.3)';
      notification.innerHTML = message;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3500);
    }

    // Draw high-visibility rounded pill badge above the face/head
    function drawHeadBadge(ctx, x, y, size, faceState) {
      const isKnown = faceState.isKnown;
      const primaryColor = isKnown ? '#10B981' : (faceState.hasData ? '#EF4444' : '#06B6D4');
      const bgColor = isKnown ? 'rgba(16, 185, 129, 0.95)' : (faceState.hasData ? 'rgba(239, 68, 68, 0.95)' : 'rgba(6, 182, 212, 0.95)');
      
      // 1. Draw Face Box
      ctx.lineWidth = 3;
      ctx.strokeStyle = primaryColor;
      ctx.strokeRect(x, y, size, size);

      // Draw corner brackets for high-tech aesthetic
      const cornerLen = Math.min(20, size * 0.2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#FFFFFF';
      
      // Top-Left
      ctx.beginPath();
      ctx.moveTo(x, y + cornerLen); ctx.lineTo(x, y); ctx.lineTo(x + cornerLen, y);
      ctx.stroke();
      // Top-Right
      ctx.beginPath();
      ctx.moveTo(x + size - cornerLen, y); ctx.lineTo(x + size, y); ctx.lineTo(x + size, y + cornerLen);
      ctx.stroke();
      // Bottom-Left
      ctx.beginPath();
      ctx.moveTo(x, y + size - cornerLen); ctx.lineTo(x, y + size); ctx.lineTo(x + cornerLen, y + size);
      ctx.stroke();
      // Bottom-Right
      ctx.beginPath();
      ctx.moveTo(x + size - cornerLen, y + size); ctx.lineTo(x + size, y + size); ctx.lineTo(x + size, y + size - cornerLen);
      ctx.stroke();

      // 2. Head Label Badge configuration
      const mainText = isKnown ? `👤 ${faceState.label}` : (faceState.hasData ? '❓ Unknown Person' : '🔍 Scanning...');
      const subText = isKnown 
        ? `${faceState.confidence}% Match • ${faceState.expression.toUpperCase()}` 
        : (faceState.hasData ? 'Not Registered in System' : 'Detecting Face...');
      
      ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
      const mainWidth = ctx.measureText(mainText).width;
      ctx.font = '12px "Segoe UI", Arial, sans-serif';
      const subWidth = ctx.measureText(subText).width;
      
      const boxWidth = Math.max(mainWidth, subWidth) + 30;
      const boxHeight = 46;
      const boxX = Math.max(10, Math.min(ctx.canvas.width - boxWidth - 10, x + (size / 2) - (boxWidth / 2)));
      const boxY = Math.max(10, y - boxHeight - 12);

      // Draw badge shadow
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      // Draw badge background pill with rounded corners
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      const radius = 8;
      ctx.moveTo(boxX + radius, boxY);
      ctx.lineTo(boxX + boxWidth - radius, boxY);
      ctx.quadraticCurveTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + radius);
      ctx.lineTo(boxX + boxWidth, boxY + boxHeight - radius);
      ctx.quadraticCurveTo(boxX + boxWidth, boxY + boxHeight, boxX + boxWidth - radius, boxY + boxHeight);
      ctx.lineTo(boxX + radius, boxY + boxHeight);
      ctx.quadraticCurveTo(boxX, boxY + boxHeight, boxX, boxY + boxHeight - radius);
      ctx.lineTo(boxX, boxY + radius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // White outline around badge
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#FFFFFF';
      ctx.stroke();

      // Draw Main Text (Name)
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px "Segoe UI", Arial, sans-serif';
      ctx.fillText(mainText, boxX + (boxWidth / 2), boxY + 15);

      // Draw Subtext (Match % & Expression)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.font = '11px "Segoe UI", Arial, sans-serif';
      ctx.fillText(subText, boxX + (boxWidth / 2), boxY + 33);
    }

    async function sendFaceForRecognition(canvasElement, x, y, size) {
      if (isSendingRecognition) return;
      isSendingRecognition = true;

      try {
        // Crop face with 20% margin for better accuracy
        const pad = Math.round(size * 0.15);
        const cropX = Math.max(0, x - pad);
        const cropY = Math.max(0, y - pad);
        const cropW = Math.min(canvasElement.width - cropX, size + pad * 2);
        const cropH = Math.min(canvasElement.height - cropY, size + pad * 2);

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 200;
        tempCanvas.height = 200;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(canvasElement, cropX, cropY, cropW, cropH, 0, 0, 200, 200);

        const imageData = tempCanvas.toDataURL('image/jpeg', 0.9);

        const response = await fetch('/recognize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageData,
            mark_attendance: isRecognizing
          })
        });

        const data = await response.json();
        
        latestFaceState = {
          isKnown: data.is_known || false,
          label: data.label || 'Unknown',
          name: data.name || 'Unknown',
          roll: data.roll || '',
          confidence: data.confidence || 0,
          expression: data.expression || 'neutral',
          lastUpdate: Date.now(),
          hasData: true
        };

        if (data.attendance_marked && data.is_known) {
          const personKey = data.label;
          if (!markedAttendanceSet.has(personKey)) {
            markedAttendanceSet.add(personKey);
            showNotification(`✅ Attendance Recorded for <strong>${data.label}</strong>!`, 'success');
            // Auto-stop attendance mode after successful record
            setTimeout(() => {
              if (isRecognizing) {
                document.getElementById('startAttendance').click();
              }
            }, 1800);
          }
        }
      } catch (err) {
        console.error('Recognition error:', err);
      } finally {
        isSendingRecognition = false;
      }
    }

    function button_callback() {
      if (initialized) {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        var ctx = document.getElementsByTagName('canvas')[0].getContext('2d');
        ctx.clearRect(0, 0, 640, 480);
        initialized = false;
        return;
      }

      var update_memory = manualDetect.instantiateMemory(5);
      var facefinder_classify_region = function(r, c, s, pixels, ldim) { return -1.0; };
      var cascadeurl = '{{ url_for("static", filename="picojs-master/examples/facefinder") }}';
      
      fetch(cascadeurl).then(function(response) {
        response.arrayBuffer().then(function(buffer) {
          var bytes = new Int8Array(buffer);
          facefinder_classify_region = manualDetect.unpackCascade(bytes);
          console.log('* Face detector loaded');
        });
      });

      var ctx = document.getElementsByTagName('canvas')[0].getContext('2d');
      function rgba_to_grayscale(rgba, nrows, ncols) { return manualDetect.rgbaToGrayscale(rgba, nrows, ncols); }

      video = document.createElement('video');
      video.setAttribute('autoplay', '1');
      video.setAttribute('playsinline', '1');

      navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
        .then(function(mediaStream) {
          stream = mediaStream;
          video.srcObject = stream;
          var last = Date.now();

          function loop() {
            if (!initialized) return;
            var now = Date.now();
            last = now;

            ctx.drawImage(video, 0, 0, 640, 480);
            var rgba = ctx.getImageData(0, 0, 640, 480).data;
            var image = { "pixels": rgba_to_grayscale(rgba, 480, 640), "nrows": 480, "ncols": 640, "ldim": 640 };
            var params = { "shiftfactor": 0.1, "minsize": 100, "maxsize": 1000, "scalefactor": 1.1 };
            
            var dets = manualDetect.runCascade(image, facefinder_classify_region, params);
            dets = update_memory(dets);
            dets = manualDetect.clusterDetections(dets, 0.2);

            let faceFound = false;
            for (let i = 0; i < dets.length; ++i) {
              if (dets[i][3] > 50.0) {
                faceFound = true;
                var r = dets[i][0], c = dets[i][1], s = dets[i][2];
                var x = c - s / 2, y = r - s / 2;

                // Send to backend recognizer every 350ms
                if (now - lastRecognitionSendTime > 350) {
                  lastRecognitionSendTime = now;
                  sendFaceForRecognition(ctx.canvas, x, y, s);
                }

                // Draw Head Badge & Bounding Box
                drawHeadBadge(ctx, x, y, s, latestFaceState);
                break; // Process primary face
              }
            }

            if (!faceFound && now - latestFaceState.lastUpdate > 2000) {
              latestFaceState.hasData = false;
            }

            requestAnimationFrame(loop);
          }

          requestAnimationFrame(loop);
        })
        .catch(function(err) {
          console.error('Camera access error:', err);
          alert('Failed to access webcam. Please allow Camera permission in your browser.');
        });

      initialized = true;
    }

    // Handle Start / Stop Attendance Button
    document.getElementById('startAttendance').addEventListener('click', function() {
      if (!initialized) {
        alert('Please start the webcam first!');
        return;
      }

      isRecognizing = !isRecognizing;
      if (isRecognizing) {
        this.innerHTML = '<i class="material-icons">stop</i> STOP ATTENDANCE';
        this.classList.remove('btn-success');
        this.classList.add('btn-danger');
        showNotification('🔍 Scanning faces to mark attendance...', 'info');
      } else {
        this.innerHTML = '<i class="material-icons">how_to_reg</i> START ATTENDANCE';
        this.classList.remove('btn-danger');
        this.classList.add('btn-success');
      }
    });

    // Auto-start camera when page loads
    window.addEventListener('DOMContentLoaded', function() {
      button_callback();
    });
  </script>
</body>
</html>
