<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Delete User</title>
    <style>
        body { background: #f5f7fa; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .card { max-width: 600px; margin: 60px auto; }
    </style>
</head>
<body>
    <div class="card shadow-sm">
        <div class="card-body text-center">
            <h4 class="card-title">Confirm Delete</h4>
            <p class="card-text">Are you sure you want to delete the following user?</p>
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item"><strong>Name:</strong> {{ user[1] }}</li>
                <li class="list-group-item"><strong>Roll No:</strong> {{ user[2] }}</li>
                <li class="list-group-item"><strong>Email:</strong> {{ user[3] }}</li>
            </ul>

            <form method="post" action="{{ url_for('delete_user', id=user[0]) }}" style="display:inline-block;">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>

            <a href="{{ url_for('userdetails') }}" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </div>
</body>
</html>
