<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="chrome=1">
		<title>Real-Time Face Detection</title>
		<script src="../manual_detect.js"></script>

		<style>
			body {
				background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
				color: #222b45;
				font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
				margin: 0;
				padding: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}
			.container {
				background: rgba(255,255,255,0.85);
				box-shadow: 0 4px 24px rgba(44,62,80,0.08);
				border-radius: 18px;
				padding: 32px 28px 24px 28px;
				margin-top: 40px;
				max-width: 480px;
				width: 100%;
				text-align: center;
			}
			h3 {
				margin-top: 0;
				font-size: 1.5rem;
				font-weight: 600;
				color: #3a506b;
			}
			p {
				color: #5c677d;
				font-size: 1.05rem;
				margin-bottom: 1.2em;
			}
			input[type="button"] {
				background: linear-gradient(90deg, #89f7fe 0%, #66a6ff 100%);
				color: #222b45;
				border: none;
				border-radius: 8px;
				padding: 12px 32px;
				font-size: 1.1rem;
				font-weight: 500;
				box-shadow: 0 2px 8px rgba(44,62,80,0.08);
				cursor: pointer;
				transition: background 0.2s, color 0.2s;
				margin-bottom: 18px;
			}
			input[type="button"]:hover {
				background: linear-gradient(90deg, #66a6ff 0%, #89f7fe 100%);
				color: #1a202c;
			}
			canvas {
				border-radius: 12px;
				box-shadow: 0 2px 16px rgba(44,62,80,0.10);
				margin-top: 10px;
				background: #f7fafc;
			}
			@media (max-width: 700px) {
				.container { max-width: 98vw; padding: 12px 2vw; }
				canvas { width: 98vw !important; height: auto !important; }
			}
		</style>
	</head>
	<script>
		var initialized = false;
		function button_callback() {
			if(initialized)
				return;
			var update_memory = manualDetect.instantiateMemory(5);
			var facefinder_classify_region = function(r, c, s, pixels, ldim) {return -1.0;};
			var cascadeurl = 'facefinder';
			fetch(cascadeurl).then(function(response) {
				response.arrayBuffer().then(function(buffer) {
					var bytes = new Int8Array(buffer);
					facefinder_classify_region = manualDetect.unpackCascade(bytes);
					console.log('* facefinder loaded');
				})
			})
			var ctx = document.getElementsByTagName('canvas')[0].getContext('2d');
			function rgba_to_grayscale(rgba, nrows, ncols) { return manualDetect.rgbaToGrayscale(rgba, nrows, ncols); }
			var video = document.createElement('video');
			video.setAttribute('autoplay', '1');
			video.setAttribute('playsinline', '1');
			navigator.mediaDevices.getUserMedia({video: true, audio: false}).then(function(stream) {
				video.srcObject = stream;
				var last = Date.now();
				function loop() {
					var now = Date.now();
					var dt = now - last;
					last = now;
					ctx.drawImage(video, 0, 0);
					var rgba = ctx.getImageData(0, 0, 640, 480).data;
					var image = { "pixels": rgba_to_grayscale(rgba, 480, 640), "nrows": 480, "ncols": 640, "ldim": 640 };
					var params = { "shiftfactor": 0.1, "minsize": 100, "maxsize": 1000, "scalefactor": 1.1 };
					var dets = manualDetect.runCascade(image, facefinder_classify_region, params);
					dets = update_memory(dets);
					dets = manualDetect.clusterDetections(dets, 0.2);
					for(i=0; i<dets.length; ++i)
						if(dets[i][3]>50.0)
						{
							var r = dets[i][0], c = dets[i][1], s = dets[i][2];
							var x = c - s/2, y = r - s/2;
							ctx.lineWidth = 3;
							ctx.strokeStyle = 'red';
							ctx.strokeRect(x, y, s, s);
						}
					requestAnimationFrame(loop);
				}
				requestAnimationFrame(loop);
			}).catch(function(err){ console.error(err); });
			initialized = true;
		}
	</script>
	<body>
		<div class="container">
			<h3>Real-Time Face Detection</h3>
			<p>Click the button below and allow the page to access your webcam.<br><b>All processing is done on your device for privacy and speed.</b></p>
			<input type="button" value="Start webcam feed" onclick="button_callback()">
			<canvas width=640 height=480></canvas>
			<p style="font-size:0.95em; color:#8a9ba8; margin-top:18px;">Manual implementation using a pretrained face cascade.</p>
		</div>
	</body>
</html>
